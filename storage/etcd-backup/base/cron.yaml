apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-snapshot-cron
spec:
  schedule: "0 23 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: "node-role.kubernetes.io/control-plane"
              operator: "Exists"
              effect: "NoSchedule"
          hostNetwork: true
          restartPolicy: OnFailure
          containers:
            - name: etcd-backup
              image: bitnami/etcd:3.5.12
              securityContext:
                runAsUser: 0
                runAsGroup: 0
              command: ["/bin/sh", "/scripts/backup.sh"]
              volumeMounts:
                - name: backup-script
                  mountPath: /scripts
                  readOnly: true
                - name: backup-vol
                  mountPath: /backup
                - name: etcd-certs
                  mountPath: /etc/etcd/pki
                  readOnly: true
          volumes:
            - name: backup-script
              configMap:
                name: etcd-backup-script
            - name: backup-vol
              persistentVolumeClaim:
                claimName: etcd-backup-pvc
            - name: etcd-certs
              hostPath:
                path: /etc/kubernetes/pki/etcd
                type: Directory
