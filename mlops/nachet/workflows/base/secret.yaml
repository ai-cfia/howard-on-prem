---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nachet-training-s3
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: nachet-training-s3
  dataFrom:
    - extract:
        key: secrets/mlflow/s3
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nachet-preparation-cold-s3
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: nachet-preparation-cold-s3
  dataFrom:
    - extract:
        key: secrets/nachet/mlops/preparation/cold-s3
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nachet-dataset-release-smoke
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: nachet-dataset-release-smoke
    creationPolicy: Owner
  data:
    - secretKey: DATASET_DATABASE_URL
      remoteRef:
        key: devsecops/cloudnativepg/nachet-dataset-release-smoke-user
        property: DATASET_DATABASE_URL
      sourceRef:
        storeRef:
          name: vault-devsecops-store
          kind: ClusterSecretStore
    - secretKey: DATASET_REGISTRY_SCHEMA
      remoteRef:
        key: devsecops/cloudnativepg/nachet-dataset-release-smoke-user
        property: DATASET_REGISTRY_SCHEMA
      sourceRef:
        storeRef:
          name: vault-devsecops-store
          kind: ClusterSecretStore
    - secretKey: S3_ENDPOINT_URL
      remoteRef:
        key: secrets/nachet/mlops/smoke
        property: S3_ENDPOINT_URL
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: secrets/nachet/mlops/smoke
        property: S3_ACCESS_KEY
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: secrets/nachet/mlops/smoke
        property: S3_SECRET_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nachet-model-publication
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: nachet-model-publication
  dataFrom:
    - extract:
        key: secrets/nachet/huggingface
---
apiVersion: v1
kind: Secret
metadata:
  name: nachet-preparation-fiftyone
type: Opaque
stringData:
  FIFTYONE_DATABASE_URI: mongodb://mongodb.mongodb.svc.cluster.local:27017/fiftyone
