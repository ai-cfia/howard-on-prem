---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nachet-training-s3
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: nachet-training-s3
  dataFrom:
    - extract:
        key: secrets/mlflow/s3
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nachet-model-publication
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: nachet-model-publication
  dataFrom:
    - extract:
        key: secrets/nachet/huggingface
---
apiVersion: v1
kind: Secret
metadata:
  name: nachet-preparation-fiftyone
type: Opaque
stringData:
  FIFTYONE_DATABASE_URI: mongodb://mongodb.mongodb.svc.cluster.local:27017/fiftyone
