---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nachet-training-s3
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: nachet-training-s3
  dataFrom:
    - extract:
        key: secrets/mlflow/s3
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nachet-training-dataset-release
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: nachet-training-dataset-release
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secrets/nachet/mlops/training/dataset-release
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nachet-preparation-cold-s3
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: nachet-preparation-cold-s3
  dataFrom:
    - extract:
        key: secrets/nachet/mlops/preparation/cold-s3
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nachet-dataset-release-smoke
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: nachet-dataset-release-smoke
    creationPolicy: Owner
  data:
    - secretKey: DATASET_DATABASE_URL
      remoteRef:
        key: devsecops/cloudnativepg/mlops-test-user
        property: DATASET_DATABASE_URL
      sourceRef:
        storeRef:
          name: vault-devsecops-store
          kind: ClusterSecretStore
    - secretKey: S3_ENDPOINT_URL
      remoteRef:
        key: secrets/nachet/mlops/smoke
        property: AWS_ENDPOINT_URL_S3
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: secrets/nachet/mlops/smoke
        property: AWS_ACCESS_KEY_ID
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: secrets/nachet/mlops/smoke
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: AWS_DEFAULT_REGION
      remoteRef:
        key: secrets/nachet/mlops/smoke
        property: AWS_DEFAULT_REGION
    - secretKey: DATASET_SMOKE_ROOT
      remoteRef:
        key: secrets/nachet/mlops/smoke
        property: TEST_ROOT_DIR
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nachet-model-publication
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: nachet-model-publication
  dataFrom:
    - extract:
        key: secrets/nachet/huggingface
