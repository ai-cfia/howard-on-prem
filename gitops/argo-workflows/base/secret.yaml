---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-workflows-sso
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # The client secret remains in Vault. External Secrets materializes only the
  # two keys Argo Server needs inside the argo-workflows namespace.
  refreshInterval: 15s
  secretStoreRef:
    name: vault-devsecops-store
    kind: ClusterSecretStore
  target:
    name: argo-workflows-sso
  data:
    - secretKey: client-id
      remoteRef:
        key: devsecops/keycloak
        property: argo-workflows-client-id
    - secretKey: client-secret
      remoteRef:
        key: devsecops/keycloak
        property: argo-workflows-client-secret
