---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fiftyone-tls
spec:
  secretName: fiftyone-tls
  duration: 2160h  # 90 days
  renewBefore: 360h  # 15 days
  subject:
    organizations:
      - ACIA CFIA AI Lab
  commonName: fiftyone.inspection.alpha.canada.ca
  dnsNames:
    - fiftyone.inspection.alpha.canada.ca
    - fiftyone-1.inspection.alpha.canada.ca
    - fiftyone-2.inspection.alpha.canada.ca
    - fiftyone-3.inspection.alpha.canada.ca
    - fiftyone-4.inspection.alpha.canada.ca
    - fiftyone-5.inspection.alpha.canada.ca
    - fiftyone-6.inspection.alpha.canada.ca
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
